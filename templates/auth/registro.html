{% extends 'base.html' %}
{% block titulo %}Registrar-se{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 mb-4">Criar conta</h1>
                <form method="POST" action="{{ url_for('auth.registro') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Nome de usuário</label>
                        <input type="text" class="form-control" id="username" name="username"
                               value="{{ username }}" minlength="3" maxlength="30"
                               pattern="[A-Za-z0-9_]+" required autofocus>
                        <div class="form-text">3 a 30 caracteres: letras, números e _.</div>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="email" name="email"
                               value="{{ email }}" maxlength="120" required>
                    </div>
                    <div class="mb-3">
                        <label for="senha" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="senha" name="senha"
                               minlength="8" required>
                        <div class="form-text">Mínimo de 8 caracteres.</div>
                    </div>
                    <div class="mb-3">
                        <label for="confirmacao" class="form-label">Confirmar senha</label>
                        <input type="password" class="form-control" id="confirmacao" name="confirmacao"
                               minlength="8" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Registrar</button>
                </form>
                <p class="mt-3 mb-0 text-center">
                    Já tem conta? <a href="{{ url_for('auth.login') }}">Entrar</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
