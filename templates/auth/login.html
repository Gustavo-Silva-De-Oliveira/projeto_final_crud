{% extends 'base.html' %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 mb-4">Entrar</h1>
                <form method="POST" action="{{ url_for('auth.login') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
                    <div class="mb-3">
                        <label for="identificador" class="form-label">Usuário ou e-mail</label>
                        <input type="text" class="form-control" id="identificador" name="identificador"
                               value="{{ identificador }}" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="senha" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="senha" name="senha" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                </form>
                <p class="mt-3 mb-0 text-center">
                    Não tem conta? <a href="{{ url_for('auth.registro') }}">Registre-se</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
