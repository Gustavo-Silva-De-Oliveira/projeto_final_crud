{% extends 'base.html' %}
{% block titulo %}{{ 'Editar cliente' if cliente else 'Novo cliente' }}{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 mb-4">{{ 'Editar cliente' if cliente else 'Novo cliente' }}</h1>
                <form method="POST"
                      action="{{ url_for('clientes.editar', id=cliente.id) if cliente else url_for('clientes.novo') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="nome" name="nome"
                               value="{{ dados.nome }}" maxlength="100" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail <span class="text-danger">*</span></label>
                        <input type="email" class="form-control" id="email" name="email"
                               value="{{ dados.email }}" maxlength="120" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="telefone" class="form-label">Telefone</label>
                            <input type="tel" class="form-control" id="telefone" name="telefone"
                                   value="{{ dados.telefone | telefone }}" placeholder="(00) 00000-0000" maxlength="20">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="cpf_cnpj" class="form-label">CPF/CNPJ <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="cpf_cnpj" name="cpf_cnpj"
                                   value="{{ dados.cpf_cnpj | cpf_cnpj }}" placeholder="Somente números ou com pontuação"
                                   maxlength="18" required>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            {{ 'Salvar alterações' if cliente else 'Cadastrar' }}
                        </button>
                        <a href="{{ url_for('clientes.lista') }}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
